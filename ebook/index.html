    <title>eBook | JPリターンズ</title>
    <link rel="icon" type="image/png" href="./shared/img/favicon.png" />

    <header class="site-header">
        <a class="brand" href="https://jpreturns.com/" aria-label="J.P.RETURNS">
            <img class="brand__logo" src="./shared/img/logo.svg" alt="J.P.RETURNS">
        </a>
    </header>

    <main class="catalog-main">
        <section class="catalog-hero" aria-labelledby="catalogTitle">
            <p class="catalog-kicker">隙間時間に学ぶ、投資と節税のこと。</p>
            <h1 class="catalog-heading" id="catalogTitle">eBook</h1>
            <p class="catalog-description">
                マンション投資をはじめとした不動産投資の情報から、投資や節税について気になる情報をeBookにまとめました。
                今後も続々公開予定です。お楽しみに。
            </p>
        </section>

        <section aria-label="eBook一覧">
            <div class="catalog-controls">
                <div class="theme-filters" id="themeFilters" aria-label="テーマで絞り込み"></div>
                <label class="sort-control">
                    <span>並び替え</span>
                    <select id="sortSelect">
                        <option value="recommended">おすすめ順</option>
                        <option value="newest">新着順</option>
                    </select>
                </label>
            </div>

            <div class="catalog-meta" id="catalogStatus">読み込み中…</div>
            <div class="ebook-grid" id="ebookGrid"></div>
        </section>

    <footer class="site-footer">
        <div class="site-footer__inner">
            <div class="site-footer__links">
