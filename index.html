<!doctype html>
<html lang="ja">
<head>
    <!-- Google Tag Manager -->
    <script>
        (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
        new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
        j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
        'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
        })(window,document,'script','dataLayer','GTM-KVNFDHW3');
    </script>
    <!-- End Google Tag Manager -->
    <meta charset="utf-8" />
    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    />
    <meta
        name="description"
        content="J.P.RETURNSの不動産投資・節税・資産形成に関するeBook・動画セミナー一覧です。"
    />
    <title>Library | JPリターンズ</title>
    <link
        rel="canonical"
        href="https://library.jpreturns.com/"
    />
    <link
        rel="icon"
        type="image/png"
        href="/ebook/shared/img/favicon.png"
    />
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="/ebook/catalog.css"
    />
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript>
        <iframe
            src="https://www.googletagmanager.com/ns.html?id=GTM-KVNFDHW3"
            height="0"
            width="0"
            style="display:none;visibility:hidden">
        </iframe>
    </noscript>
    <!-- End Google Tag Manager (noscript) -->

    <header class="site-header">
        <a
            class="brand"
            href="https://jpreturns.com/"
            aria-label="J.P.RETURNS"
        >
            <img
                class="brand__logo"
                src="/ebook/shared/img/logo.svg"
                alt="J.P.RETURNS"
            >
        </a>
    </header>

    <main class="catalog-main">
        <section
            class="catalog-hero"
            aria-labelledby="catalogTitle"
        >
            <h1
                class="catalog-kicker"
                id="catalogTitle"
            >
                隙間時間に学ぶ、投資と節税のこと。
            </h1>

            <div
                class="catalog-tabs"
                role="tablist"
                aria-label="コンテンツ種別"
            >
                <button
                    class="catalog-tab"
                    type="button"
                    role="tab"
                    data-catalog-tab="ebook"
                    aria-selected="true"
                >
                    eBook
                </button>
                <button
                    class="catalog-tab"
                    type="button"
                    role="tab"
                    data-catalog-tab="video"
                    aria-selected="false"
                    tabindex="-1"
                >
                    動画セミナー
                </button>
            </div>

            <p
                class="catalog-description"
                id="catalogDescription"
            >
                マンション投資をはじめとした不動産投資の情報から、投資や節税について気になる情報をeBookにまとめました。今後も続々公開予定です。お楽しみに。
            </p>
        </section>

        <section aria-label="コンテンツ一覧">
            <div class="catalog-controls">
                <label class="catalog-select">
                    <span>テーマ</span>
                    <select id="themeSelect"></select>
                </label>

                <label class="catalog-select">
                    <span>並び替え</span>
                    <select id="sortSelect">
                        <option value="recommended">
                            おすすめ順
                        </option>
                        <option value="newest">
                            新着順
                        </option>
                    </select>
                </label>
            </div>

            <div
                class="catalog-meta"
                id="catalogStatus"
            >
                読み込み中…
            </div>

            <div
                class="catalog-grid"
                id="catalogGrid"
            ></div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="site-footer__inner">
            <p class="site-footer__copyright">
                © J.P.Returns. All rights reserved.
            </p>
        </div>
    </footer>

    <script src="/ebook/catalog-config.js"></script>
    <script src="/ebook/catalog.js"></script>
</body>
</html>
